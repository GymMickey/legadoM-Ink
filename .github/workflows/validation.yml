name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      android_test: ${{ steps.filter.outputs.android_test }}
      room: ${{ steps.filter.outputs.room }}
      web: ${{ steps.filter.outputs.web }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect affected areas
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          android=false
          android_test=false
          room=false
          web=false
          security=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "android=true"
              echo "android_test=true"
              echo "room=true"
              echo "web=true"
              echo "security=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/validation.yml)
                android=true
                android_test=true
                room=true
                web=true
                security=true
                ;;
              app/src/main/*|app/src/androidTest/*|app/build.gradle|app/download.gradle|build.gradle|settings.gradle|gradle/*|gradle.properties|modules/book/*|modules/rhino/*)
                android=true
                ;;
            esac
            case "$path" in
              .github/workflows/validation.yml|gradle.properties|app/src/androidTest/*|app/src/main/java/io/legado/app/api/*|app/src/main/java/io/legado/app/web/*|app/src/main/java/io/legado/app/help/http/*|app/src/main/java/io/legado/app/lib/webdav/*|app/src/main/res/xml/network_security_config.xml|app/src/main/AndroidManifest.xml|app/build.gradle|app/download.gradle|build.gradle|settings.gradle|gradle/*|modules/book/*|modules/rhino/*)
                android_test=true
                ;;
            esac
            case "$path" in
              app/src/main/java/io/legado/app/data/*|app/src/main/java/io/legado/app/help/storage/*|app/schemas/*|app/src/androidTest/java/io/legado/app/MigrationTest.kt|app/src/androidTest/java/io/legado/app/*Backup*)
                room=true
                ;;
            esac
            case "$path" in
              modules/web/*|app/src/main/assets/web/*)
                web=true
                ;;
            esac
            case "$path" in
              app/src/androidTest/java/io/legado/app/ExampleInstrumentedTest.kt|app/src/androidTest/java/io/legado/app/NetworkSecurityTest.kt|app/src/androidTest/java/io/legado/app/web/*|app/src/main/java/io/legado/app/api/*|app/src/main/java/io/legado/app/web/*|app/src/main/java/io/legado/app/help/http/*|app/src/main/java/io/legado/app/lib/webdav/*|app/src/main/res/xml/network_security_config.xml|app/src/main/AndroidManifest.xml)
                security=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          {
            echo "android=$android"
            echo "android_test=$android_test"
            echo "room=$room"
            echo "web=$web"
            echo "security=$security"
          } >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Prepare Cronet compile dependencies
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:downloadJar --stacktrace
      - name: Compile and run stable unit tests
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:compileAppMaxDebugKotlin :app:testAppMaxDebugUnitTest --stacktrace

  android-quality:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Prepare Cronet compile dependencies
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:downloadJar --stacktrace
      - name: Build and lint affected Android code
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:assembleAppMaxDebug :app:lintAppMaxDebug --stacktrace

  android-test-compile:
    needs: changes
    if: needs.changes.outputs.android_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Prepare Cronet compile dependencies
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:downloadJar --stacktrace
      - name: Compile AndroidTest sources only
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:compileAppMaxDebugAndroidTestKotlin --stacktrace

  android-security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Prepare Cronet compile dependencies
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:downloadJar --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run Provider, Web, and network security tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: false
          script: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:connectedAppMaxDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=io.legado.app.ExampleInstrumentedTest,io.legado.app.NetworkSecurityTest,io.legado.app.web.WebServiceAuthTest" --stacktrace

  room-migrations:
    needs: changes
    if: needs.changes.outputs.room == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Prepare Cronet compile dependencies
        run: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:downloadJar --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run Room migration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: false
          script: ./gradlew -PdisableFirebase=true -PRELEASE_STORE_FILE= :app:connectedAppMaxDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.legado.app.MigrationTest --stacktrace

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: modules/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm build
