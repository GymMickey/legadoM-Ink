def firebaseExplicitlyDisabled = providers.gradleProperty("disableFirebase")
        .map { it.toBoolean() }
        .getOrElse(false)
def hasGoogleServicesConfig = file("google-services.json").exists() ||
        !fileTree("src") {
            include "**/google-services.json"
        }.isEmpty()
def firebaseEnabled = !firebaseExplicitlyDisabled && hasGoogleServicesConfig

if (firebaseEnabled) {
    apply plugin: "com.google.gms.google-services"
}

apply from: 'download.gradle'

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

static def releaseCode() {
    return new Date().format("yyDDDHHmm", TimeZone.getTimeZone("GMT+8")).toInteger()
}

def gitCommits = 0
try {
    // 按发布 tag 最大编号 +1，不再跟随每个 commit 跳动
    def tags = 'git tag -l "v3.26-beta.*"'.execute().text.trim()
    if (tags) {
        def maxBeta = tags.split("\n").collect {
            it.replace("v3.26-beta.", "").toInteger()
        }.max()
        gitCommits = maxBeta + 1
    }
} catch (Exception ignored) {
}

def name = "M-Ink"
def version = "3.26-beta " + gitCommits
def bundledReleaseStoreFile = rootProject.file(".github/workflows/legado.jks")
def resolvedReleaseStoreFile = project.findProperty("RELEASE_STORE_FILE") ? file(project.property("RELEASE_STORE_FILE")) : (bundledReleaseStoreFile.exists() ? bundledReleaseStoreFile : null)
def resolvedReleaseKeyAlias = project.findProperty("RELEASE_KEY_ALIAS") ?: "legado"
def resolvedReleaseStorePassword = project.findProperty("RELEASE_STORE_PASSWORD") ?: null
def resolvedReleaseKeyPassword = project.findProperty("RELEASE_KEY_PASSWORD") ?: null
try {
    def tags = 'git tag -l "v3.26-beta.*"'.execute().text.trim()
    if (tags) {
        def maxBeta = tags.split("\n").collect {
            it.replace("v3.26-beta.", "").toInteger()
        }.max()
        gitCommits = maxBeta + 1
    }
} catch (Exception ignored) {
}

android {
    compileSdk 36
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (resolvedReleaseStoreFile != null) {
            myConfig {
                storeFile resolvedReleaseStoreFile
                storePassword resolvedReleaseStorePassword
                keyAlias resolvedReleaseKeyAlias
                keyPassword resolvedReleaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
            debugConfig {
                storeFile resolvedReleaseStoreFile
                storePassword resolvedReleaseStorePassword
                keyAlias resolvedReleaseKeyAlias
                keyPassword resolvedReleaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = false
            }
        }
    }
    defaultConfig {
        applicationId "io.legado.app.yuedu"
        minSdk 21
        targetSdk 36
        versionCode releaseCode()
        versionName "3.26-beta30"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", "LegadoM-Ink_3.26-beta30")

        // 👇 就是这行，修复渠道占位符报错
        manifestPlaceholders = [APP_CHANNEL_VALUE: "local"]

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }
    flavorDimensions "app"
    productFlavors {
        appS {
            dimension "app"
            applicationId "io.legado.app.yuedu.a"
            manifestPlaceholders = [app_name: "@string/app_name_a"]
        }
        appLegacy {
            dimension "app"
            applicationId "io.legado.app"
            manifestPlaceholders = [app_name: "@string/app_name"]
        }
        appMax {
            dimension "app"
            applicationId "io.legado.app.yuedu"
            manifestPlaceholders = [app_name: "@string/app_name_sigma"]
        }
    }
    buildTypes {
        release {
            if (resolvedReleaseStoreFile != null) {
                signingConfig signingConfigs.myConfig
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (resolvedReleaseStoreFile != null) {
                signingConfig signingConfigs.debugConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name_debug")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            // minifyEnabled true
            // shrinkResources = true
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorName = variant.flavorName
            def flavorLabel = [
                    appS     : "正式版",
                    appMax   : "正式版",
                    appLegacy: "兼容版"
            ][flavorName] ?: flavorName
            def flavorSuffix = [
                    appS     : "releaseS",
                    appMax   : "release",
                    appLegacy: "legacy"
            ][flavorName] ?: flavorName
            outputFileName = "LegadoM-Ink_${flavorLabel}_${defaultConfig.versionName}_${flavorSuffix}.apk"
        }
    }


    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")
        arg("skipPrivatePreviews", "true")
    }
    
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
    }
    
    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }

}

